# Custom Fire Detection Architecture (12-Layer Backbone & FPN Optimization)
# Ultralytics YOLO 🚀, GPL-3.0 license

# Parameters
nc: 2  # Number of classes: 0: fire, 1: smoke
depth_multiple: 0.33  # Scales module repeats
width_multiple: 0.50  # Enhanced channel capacity for rich texture features (fire flicker/smoke density)

# Custom 12-Layer Backbone Architecture (Layers 0 to 9)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2: Early color & brightness feature extraction
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4: Fine spatial downsampling
  - [-1, 3, C2f, [128, True]]      # 2: High-resolution bottleneck for edge flame details
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8: Medium downsampling
  - [-1, 6, C2f, [256, True]]      # 4: Enhanced spatial feature map for small/distant fire
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16: Deep downsampling
  - [-1, 6, C2f, [512, True]]      # 6: Mid-to-high level smoke plume feature extraction
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32: High level contextual downsampling
  - [-1, 3, C2f, [1024, True]]     # 8: Deep semantic representation
  - [-1, 1, SPPF, [1024, 5]]       # 9: Spatial Pyramid Pooling Fast (Global context fusion)

# Head & FPN Neck Integration (Layers 10 to 22, anchored by Layer 10-12 Top-Down Node)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10: Upsample P5 features to P4 resolution
  - [[-1, 6], 1, Concat, [1]]                   # 11: Concat with Backbone Layer 6 (P4)
  - [-1, 3, C2f, [512]]                         # 12: Primary Top-Down Fusion Block (Backbone-Neck Bridge)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13: Upsample to P3 resolution
  - [[-1, 4], 1, Concat, [1]]                   # 14: Concat with Backbone Layer 4 (P3)
  - [-1, 3, C2f, [256]]                         # 15: P3/8-small object detection head

  - [-1, 1, Conv, [256, 3, 2]]                  # 16: Downsample to P4
  - [[-1, 12], 1, Concat, [1]]                  # 17: Concat with Head Layer 12
  - [-1, 3, C2f, [512]]                         # 18: P4/16-medium object detection head

  - [-1, 1, Conv, [512, 3, 2]]                  # 19: Downsample to P5
  - [[-1, 9], 1, Concat, [1]]                   # 20: Concat with Head Layer 9 (SPPF output)
  - [-1, 3, C2f, [1024]]                        # 21: P5/32-large object detection head

  - [[15, 18, 21], 1, Detect, [nc]]             # 22: Multi-Scale Anchor-Free Fire/Smoke Detection Head
